name: CI/CD Pipeline

on:
  push:
    branches: [dev] # runs when a PR is merged into dev, not on PR pushes
  workflow_dispatch: # manual re-run

jobs:
  # ──────────────────────────────────────────────
  # 1. Quality Checks (runs on PRs + pushes)
  # ──────────────────────────────────────────────
  quality-checks:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm prettier --check "src/**/*.{ts,tsx}"

      - name: Type checking
        run: npx tsc --noEmit

      - name: Build project
        run: pnpm build

  # ──────────────────────────────────────────────
  # 2. E2E Tests with Playwright (runs on PRs + pushes)
  # ──────────────────────────────────────────────
  e2e-tests:
    needs: quality-checks
    runs-on: ubuntu-24.04
    if: always() && needs.quality-checks.result == 'success'

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        continue-on-error: true
        run: BASE_URL=http://localhost:3001 pnpm playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (HTML)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  # ──────────────────────────────────────────────
  # 3. Deploy to cPanel over SSH (only on dev push)
  # ──────────────────────────────────────────────
  deploy:
    needs: [quality-checks, e2e-tests]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.quality-checks.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Copy .htaccess to build output
        run: cp .htaccess build/.htaccess

      - name: Deploy build to cPanel over SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HOST: ${{ secrets.CPANEL_HOST }}
          USER_: ${{ secrets.CPANEL_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          # prints the PUBLIC key so it can be matched against cPanel > SSH Access > Authorize
          ssh-keygen -y -f ~/.ssh/id_deploy || { echo "CPANEL_SSH_KEY is not a valid unencrypted private key"; exit 1; }
          # no --delete: keeps server-only files (mailer env, etc.)
          rsync -rltz -e "ssh -i ~/.ssh/id_deploy" build/ "$USER_@$HOST:public_html/"

      - name: Deployment Summary
        run: echo "Deployed dev to https://rowad.com via rsync (public_html/)"
