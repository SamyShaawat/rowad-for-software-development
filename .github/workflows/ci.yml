name: CI/CD Pipeline

on:
  push:
    branches: [dev] # runs when a PR is merged into dev, not on PR pushes
  workflow_dispatch: # manual re-run

jobs:
  # ──────────────────────────────────────────────
  # 1. Quality Checks (runs on PRs + pushes)
  # ──────────────────────────────────────────────
  quality-checks:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm prettier --check "src/**/*.{ts,tsx}"

      - name: Type checking
        run: npx tsc --noEmit

      - name: Build project
        run: pnpm build

  # ──────────────────────────────────────────────
  # 2. E2E Tests with Playwright against the built site (a failure blocks deploy)
  # ──────────────────────────────────────────────
  e2e-tests:
    needs: quality-checks
    runs-on: ubuntu-24.04
    if: always() && needs.quality-checks.result == 'success'

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build static export (the files that get deployed)
        run: pnpm build

      - name: Run E2E tests against the built site
        run: BASE_URL=http://localhost:3001 pnpm playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (HTML)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  # ──────────────────────────────────────────────
  # 3. Deploy to cPanel over SSH (only on dev push)
  # ──────────────────────────────────────────────
  deploy:
    needs: [quality-checks, e2e-tests]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.quality-checks.result == 'success' && needs.e2e-tests.result == 'success'
    # One deploy at a time. Queued ones re-check below that they are still the newest commit.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Check this is still the newest commit on dev
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A slower, older run must never overwrite a newer deploy (it did: #36 over #37).
          latest=$(gh api "repos/${{ github.repository }}/commits/dev" --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "dev is now at $latest, this run is $GITHUB_SHA. Skipping deploy: the newer run deploys it."
          fi

      - name: Copy .htaccess and version marker to build output
        if: steps.fresh.outputs.latest == 'true'
        run: |
          cp .htaccess build/.htaccess
          echo "$GITHUB_SHA" > build/version.txt

      - name: Deploy build to cPanel over SSH
        if: steps.fresh.outputs.latest == 'true'
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HOST: ${{ secrets.CPANEL_HOST }}
          USER_: ${{ secrets.CPANEL_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          # prints the PUBLIC key so it can be matched against cPanel > SSH Access > Authorize
          ssh-keygen -y -f ~/.ssh/id_deploy || { echo "CPANEL_SSH_KEY is not a valid unencrypted private key"; exit 1; }
          SSH="ssh -i ~/.ssh/id_deploy"
          # Manifest of every file this deploy uploads. No rsync --delete: public_html also holds
          # server-only files (cgi-bin, .well-known, ...). Instead we remove only files that the
          # previous deploy uploaded and this build no longer has.
          (cd build && find . -type f ! -name .deploy-manifest -printf '%P\n' | sort > .deploy-manifest)
          rsync -z -e "$SSH" "$USER_@$HOST:public_html/.deploy-manifest" old-manifest.txt 2>/dev/null || : > old-manifest.txt
          # one-time: the PHP mailer was deployed before manifests existed
          echo contact-mailer.php >> old-manifest.txt
          rsync -rltz -e "$SSH" build/ "$USER_@$HOST:public_html/"
          bash scripts/stale-files.sh old-manifest.txt build/.deploy-manifest > stale.txt
          if [ -s stale.txt ]; then
            echo "Removing files that are no longer in the build:"; cat stale.txt
            $SSH "$USER_@$HOST" 'cd public_html && xargs -d "\n" rm -f --' < stale.txt
          fi

      - name: Smoke test the live site
        if: steps.fresh.outputs.latest == 'true'
        run: |
          # Apache can behave differently from the static server used in e2e (e.g. a folder and a page sharing a name)
          for path in / /services /clients /about /contact /ar /ar/services /ar/clients /ar/about /ar/contact /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "https://rowad.com$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "Smoke test failed for $path"; exit 1; }
          done
          # The live site must be this exact commit (200s alone cannot tell a stale deploy)
          live=$(curl -s --retry 3 --retry-delay 5 --retry-all-errors "https://rowad.com/version.txt?x=$RANDOM" | tr -d '[:space:]')
          echo "live version: $live (expected $GITHUB_SHA)"
          [ "$live" = "$GITHUB_SHA" ] || { echo "Smoke test failed: live site is not this commit"; exit 1; }

      - name: Deployment Summary
        run: |
          if [ "${{ steps.fresh.outputs.latest }}" = "true" ]; then echo "Deployed $GITHUB_SHA to https://rowad.com via rsync (public_html/)"; else echo "Skipped: a newer commit is on dev"; fi
